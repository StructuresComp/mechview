<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MechView</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #111; color: #eee; font-family: monospace; overflow: hidden; }

        #controls {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            gap: 14px;
            height: 48px;
        }

        button {
            background: #2a2a2a;
            color: #ddd;
            border: 1px solid #444;
            padding: 5px 14px;
            cursor: pointer;
            font-family: monospace;
            font-size: 13px;
            white-space: nowrap;
        }
        button:hover:not(:disabled) { background: #3a3a3a; }
        button:disabled { opacity: 0.4; cursor: default; }
        button.recording { background: #7a0000; border-color: #f00; color: #fff; }

        #slider { flex: 1; cursor: pointer; }
        #frameInfo { font-size: 12px; color: #999; min-width: 90px; }
        #status { font-size: 12px; color: #f90; flex: 1; }

        /* Per-frame label overlay — edit font/position/colour here */
        #frameLabel {
            position: fixed;
            top: 16px; left: 50%;
            transform: translateX(-50%);
            font-family: monospace;
            font-size: 15px;
            color: #111;
            background: rgba(255, 255, 255, 0.72);
            padding: 4px 14px;
            border-radius: 3px;
            white-space: pre-line;     /* "\n" in a label starts a new line */
            text-align: center;
            pointer-events: none;      /* never blocks mouse/orbit */
            display: none;             /* hidden when frame has no label */
        }
    </style>
</head>
<body>

<div id="frameLabel"></div>

<div id="controls">
    <button id="btnPlayPause">▶ Play</button>
    <input type="range" id="slider" min="0" max="0" value="0" step="1">
    <span id="frameInfo">0 / 0</span>
    <button id="btnRecord">⏺ Record</button>
    <span id="status">Loading data.js…</span>
</div>

<!-- Three.js via CDN (ES module) -->
<script type="importmap">
{
    "imports": {
        "three":          "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

<!-- JSZip for bundling PNG frames -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<!-- Data — generated by generate_synthetic.py or export.py; defines window.MECHVIEW_DATA -->
<script src="data.js" onerror="window._data_missing=true"></script>

<script type="module">
import * as THREE       from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------------------
// RENDERER + SCENE
// ---------------------------------------------------------------------------

const CTRL_H = 48;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);

// ---------------------------------------------------------------------------
// SHADOWS
// Shadow mapping must be enabled on the renderer before anything else.
// Type options (trade quality vs. performance):
//   THREE.BasicShadowMap      — fastest, hard aliased edges
//   THREE.PCFShadowMap        — default, slightly soft edges
//   THREE.PCFSoftShadowMap    — softest, most expensive
// ---------------------------------------------------------------------------
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;

document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f0f0);  // ← change to 0xffffff for pure white, 0x1c1c1c for dark

const camera = new THREE.PerspectiveCamera(45, 1, 1e-4, 100);

const orbitControls = new OrbitControls(camera, renderer.domElement);

// ---------------------------------------------------------------------------
// LIGHTING
// All coordinates are in normalised units (rod length = 1).
//
// Rig: strong white ambient (bright, even base) + one tight SpotLight for
// sharp shadows. The ambient keeps the scene looking clean and white-ish;
// the spot adds depth without making anything look dark.
//
//   1. Ambient   — broad white fill. Raise toward 1.0 for a flat white-lab
//                  look; lower for more contrast.
//   2. SpotLight — shadow caster. Tight penumbra = crisp shadow edge.
//                  Move position to reposition highlights/shadows.
//                  Increase mapSize for finer shadow detail (costs VRAM).
// ---------------------------------------------------------------------------

// 1. Ambient — keep low so shadows read clearly; raise toward 1.0 for a flat look
const ambientLight = new THREE.AmbientLight(0xffffff, 0.28);
scene.add(ambientLight);

// 2. SpotLight — single shadow-casting key light
//    position  : upper-right-front; change to move the shadow
//    angle     : cone half-angle in radians (smaller = tighter, sharper beam)
//    penumbra  : 0 = hard edge, 1 = fully soft — keep low for crisp shadows
//    decay     : fall-off with distance (2 = physical; lower = reaches farther)
const spotLight = new THREE.SpotLight(0xffffff, 3.5);
spotLight.position.set(0.3, 2.0, 0.3);  // ← roughly overhead so shadow falls on wall below
spotLight.angle    = 0.55;              // ← wide enough to cover the plate
spotLight.penumbra = 0.15;             // ← slight softness on shadow edge
spotLight.decay    = 1.2;
spotLight.castShadow = true;
spotLight.shadow.mapSize.width  = 4096; // ← 2048 if performance is a concern
spotLight.shadow.mapSize.height = 4096;
spotLight.shadow.camera.near = 0.1;
spotLight.shadow.camera.far  = 20;
scene.add(spotLight);

function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight - CTRL_H;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------------
// STATE
// ---------------------------------------------------------------------------

let frames       = [];      // [{t, nodes: [[x,y,z], ...]}, ...]
let rodRadius    = 0.003;
let objectColor  = null;   // set in loadData from data.color; null = use per-type default
let currentFrame = 0;
let playing      = false;
let lastTick     = 0;
let FPS          = 12;    // playback speed (frames per second); data.fps overrides it
let objectType   = 'rod'; // set in loadData; drives rod/shell dispatch
let ghostStyle   = null;  // set in loadData from data.ghost; null = no ghost curve

// ---------------------------------------------------------------------------
// ROD / BEAM — CatmullRomCurve3 + TubeGeometry
// ---------------------------------------------------------------------------

let tubeMesh = null;

function buildTube(nodeList) {
    if (tubeMesh) {
        scene.remove(tubeMesh);
        tubeMesh.geometry.dispose();
        tubeMesh.material.dispose();
        tubeMesh = null;
    }
    if (!nodeList || nodeList.length < 2) return;

    const pts = nodeList.map(n => new THREE.Vector3(n[0], n[1], n[2] ?? 0));
    const curve = new THREE.CatmullRomCurve3(pts);

    const geo = new THREE.TubeGeometry(curve, pts.length * 8, rodRadius, 12, false);
    const mat = new THREE.MeshPhongMaterial({
        color:     objectColor ?? 0xff3311,
        shininess: 140,
        specular:  0x333333,
    });
    tubeMesh = new THREE.Mesh(geo, mat);
    tubeMesh.castShadow    = true;   // rod casts a shadow onto obstacles / floor
    tubeMesh.receiveShadow = true;   // rod receives shadows (e.g. from itself curling)
    scene.add(tubeMesh);
}

// ---------------------------------------------------------------------------
// GHOST — optional second, translucent tube (e.g. a target or reference shape)
//
// Styled by data.ghost = {color, opacity, rod_radius}; drawn from each frame's
// ghost_nodes. A frame without ghost_nodes shows no ghost. Rods / beams only.
// ---------------------------------------------------------------------------

let ghostMesh = null;

function buildGhost(nodeList) {
    if (ghostMesh) {
        scene.remove(ghostMesh);
        ghostMesh.geometry.dispose();
        ghostMesh.material.dispose();
        ghostMesh = null;
    }
    if (!ghostStyle || !nodeList || nodeList.length < 2) return;

    const pts = nodeList.map(n => new THREE.Vector3(n[0], n[1], n[2] ?? 0));
    const curve = new THREE.CatmullRomCurve3(pts);

    const geo = new THREE.TubeGeometry(curve, pts.length * 8, ghostStyle.rod_radius ?? rodRadius, 12, false);
    const mat = new THREE.MeshPhongMaterial({
        color:       ghostStyle.color ?? 0x888888,
        transparent: true,
        opacity:     ghostStyle.opacity ?? 0.35,
        depthWrite:  false,   // the rod stays visible through the ghost
        shininess:   60,
    });
    ghostMesh = new THREE.Mesh(geo, mat);
    ghostMesh.castShadow = false;
    ghostMesh.renderOrder = 1;        // draw after the opaque rod
    scene.add(ghostMesh);
}

// ---------------------------------------------------------------------------
// SHELL / PLATE — BufferGeometry with static face index
//
// Faces (connectivity) never change; only node positions update each frame.
// Using THREE.DoubleSide so both top and bottom faces are visible without
// needing two meshes (unlike the old THREE.Geometry approach).
// ---------------------------------------------------------------------------

let shellGeo  = null;  // reused across frames — only positions updated
let shellMesh = null;

function initShell(data) {
    // Called once from loadData. Allocates geometry and sets the static index.
    const nv    = data.nv;
    const faces = data.faces;   // [[i0,i1,i2], ...]

    shellGeo = new THREE.BufferGeometry();

    // Position placeholder — filled properly in the first updateShell call
    shellGeo.setAttribute(
        'position',
        new THREE.BufferAttribute(new Float32Array(nv * 3), 3)
    );

    // Face index — static for the whole animation
    const idx = new Uint32Array(faces.length * 3);
    for (let f = 0; f < faces.length; f++) {
        idx[f*3]     = faces[f][0];
        idx[f*3 + 1] = faces[f][1];
        idx[f*3 + 2] = faces[f][2];
    }
    shellGeo.setIndex(new THREE.BufferAttribute(idx, 1));

    const mat = new THREE.MeshPhongMaterial({
        color:     objectColor ?? 0x4488cc,
        shininess: 400,
        specular:  0xffffff,
        side:      THREE.DoubleSide,  // both faces lit — no need for two meshes
    });
    shellMesh = new THREE.Mesh(shellGeo, mat);
    shellMesh.castShadow    = true;
    shellMesh.receiveShadow = true;
    scene.add(shellMesh);
}

function updateShell(nodeList) {
    if (!shellGeo || !nodeList) return;
    const pos = shellGeo.attributes.position.array;
    for (let i = 0; i < nodeList.length; i++) {
        pos[i*3]     = nodeList[i][0];
        pos[i*3 + 1] = nodeList[i][1];
        pos[i*3 + 2] = nodeList[i][2] ?? 0;
    }
    shellGeo.attributes.position.needsUpdate = true;
    shellGeo.computeVertexNormals();  // recompute per-vertex normals from updated positions
}

function showFrame(idx) {
    idx = Math.max(0, Math.min(idx, frames.length - 1));
    currentFrame = idx;

    const nodes = frames[idx].nodes;
    if (objectType === 'shell' || objectType === 'plate') {
        updateShell(nodes);
    } else {
        buildTube(nodes);
        buildGhost(frames[idx].ghost_nodes);
    }

    slider.value = idx;
    frameInfo.textContent = `${idx + 1} / ${frames.length}`;

    // Per-frame label (optional field in data.js)
    const label = frames[idx].label;
    if (label) {
        frameLabel.textContent = label;
        frameLabel.style.display = 'block';
    } else {
        frameLabel.style.display = 'none';
    }
}

// ---------------------------------------------------------------------------
// ANIMATION LOOP
// ---------------------------------------------------------------------------

function animate(ts) {
    requestAnimationFrame(animate);
    orbitControls.update();

    if (playing && frames.length) {
        if (ts - lastTick > 1000 / FPS) {
            lastTick = ts;
            showFrame(currentFrame + 1);
            if (currentFrame >= frames.length - 1) {
                playing = false;
                btnPlayPause.textContent = '▶ Play';
            }
        }
    }

    renderer.render(scene, camera);
}

// ---------------------------------------------------------------------------
// CONTROLS
// ---------------------------------------------------------------------------

const btnPlayPause = document.getElementById('btnPlayPause');
const slider       = document.getElementById('slider');
const frameInfo    = document.getElementById('frameInfo');
const frameLabel   = document.getElementById('frameLabel');
const btnRecord    = document.getElementById('btnRecord');
const statusEl     = document.getElementById('status');

btnPlayPause.addEventListener('click', () => {
    if (!frames.length) return;
    playing = !playing;
    btnPlayPause.textContent = playing ? '⏸ Pause' : '▶ Play';
    if (playing && currentFrame >= frames.length - 1) showFrame(0);
});

slider.addEventListener('input', () => {
    playing = false;
    btnPlayPause.textContent = '▶ Play';
    showFrame(parseInt(slider.value));
});

// ---------------------------------------------------------------------------
// RECORD  (capture every frame → zip of PNGs → download)
// ---------------------------------------------------------------------------

btnRecord.addEventListener('click', async () => {
    if (!frames.length) return;

    // lock UI
    [btnPlayPause, btnRecord, slider].forEach(el => el.disabled = true);
    playing = false;
    btnPlayPause.textContent = '▶ Play';
    btnRecord.classList.add('recording');

    const zip = new JSZip();

    for (let i = 0; i < frames.length; i++) {
        showFrame(i);
        renderer.render(scene, camera);   // force immediate render

        const blob = await new Promise(res =>
            renderer.domElement.toBlob(res, 'image/png')
        );
        zip.file(`frame_${String(i + 1).padStart(6, '0')}.png`, blob);
        statusEl.textContent = `Recording ${i + 1} / ${frames.length}`;
    }

    statusEl.textContent = 'Zipping…';
    const content = await zip.generateAsync({ type: 'blob' });

    const a = document.createElement('a');
    a.href = URL.createObjectURL(content);
    a.download = 'frames.zip';
    a.click();

    // unlock UI
    [btnPlayPause, btnRecord, slider].forEach(el => el.disabled = false);
    btnRecord.classList.remove('recording');
    statusEl.textContent = `Done — extract zip, then: ffmpeg -framerate ${FPS} -i frame_%06d.png -c:v libx264 -pix_fmt yuv420p out.mp4`;
});

// ---------------------------------------------------------------------------
// LOAD DATA
// ---------------------------------------------------------------------------

function loadData(data) {
    frames      = data.frames;
    objectType  = data.object_type;
    objectColor = data.color ?? null;
    FPS         = data.fps ?? FPS;

    // Per-type initialisation
    if (objectType === 'shell' || objectType === 'plate') {
        initShell(data);
    } else {
        rodRadius  = data.rod_radius ?? 0.003;
        ghostStyle = data.ghost ?? null;
    }

    // Obstacles — each is an axis-aligned box {center:[x,y,z], size:[w,h,d]}
    const obsMat = new THREE.MeshPhongMaterial({
        color: 0xaaaaaa, shininess: 20, specular: 0x444444,
    });
    for (const obs of (data.obstacles ?? [])) {
        const geo  = new THREE.BoxGeometry(obs.size[0], obs.size[1], obs.size[2]);
        const mesh = new THREE.Mesh(geo, obsMat);
        mesh.position.set(obs.center[0], obs.center[1], obs.center[2]);
        mesh.castShadow    = false;  // wall doesn't cast a shadow on the object
        mesh.receiveShadow = true;   // wall shows the object's shadow on its surface
        scene.add(mesh);
    }

    // Camera — data.camera = {position, target} if given. Otherwise the default:
    // shells lie in the X-Z plane so look from above;
    // rods/beams hang vertically so look from the side centred on the wall.
    if (data.camera) {
        camera.position.set(...data.camera.position);
        orbitControls.target.set(...data.camera.target);
    } else if (objectType === 'shell' || objectType === 'plate') {
        camera.position.set(0.6, 0.9, 1.0);
        orbitControls.target.set(0, 0, 0);
    } else {
        const wall_y = data.obstacles?.length ? data.obstacles[0].center[1] : -0.5;
        const mid_y  = wall_y / 2;
        camera.position.set(0.0, mid_y, 2.5);
        orbitControls.target.set(0, mid_y, 0);
    }
    orbitControls.update();

    slider.max = frames.length - 1;
    showFrame(0);
    statusEl.textContent = `${frames.length} frames loaded  |  ${objectType}  |  nv=${data.nv}`;
}

if (window._data_missing || typeof MECHVIEW_DATA === 'undefined') {
    statusEl.textContent = 'No data.js found — run generate_synthetic.py or export.py first.';
} else {
    loadData(MECHVIEW_DATA);
}

animate(0);

</script>
</body>
</html>
