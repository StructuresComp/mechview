[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mechview"
version = "0.1.0"
description = "3D animation viewer for rods, beams, and shells from any mesh simulation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.scripts]
mechview = "mechview.cli:main"

[tool.setuptools.package-data]
mechview = ["*.html", "*.py"]
